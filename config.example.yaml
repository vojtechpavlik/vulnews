# VulNews configuration
# Copy this to config.yaml and adjust as needed.

# Polling interval in seconds (daemon mode only).
poll_interval: 300

# Maximum articles to process per source per poll cycle.
# Prevents excessive LLM calls on first run.
max_articles_per_source: 10

# Minimum confidence threshold for LLM compromise detection (0.0 - 1.0).
confidence_threshold: 0.5

# Directory for persistent state (ETag cache, compromise database).
state_dir: ./state

# LLM command. Article text is piped via stdin.
# Must produce JSON on stdout matching the expected schema.
llm_command: >-
  gemini -p "You are a supply chain security analyst. Read the article
  provided on stdin. Determine if it describes a NEW supply chain compromise
  -- meaning an actual compromise of a package in a software repository (npm,
  PyPI, RubyGems, Cargo, Maven, NuGet, Go modules, OBS, etc.), a build
  system, or a distribution channel.

  This is NOT about general CVE vulnerabilities, security advisories about
  bugs, or theoretical attack vectors. Only flag articles about CONFIRMED
  compromises where malicious code was actually inserted into a package or
  build artifact.

  Respond with ONLY valid JSON (no markdown fences, no commentary). Schema:
  {\"is_compromise\": bool, \"confidence\": float 0-1,
  \"package_name\": string or null,
  \"package_ecosystem\": string or null (e.g. npm/pypi/rubygems/maven/cargo),
  \"affected_versions\": string or null (e.g. \">=2.1.0,<2.1.5\"),
  \"compromised_timeframe\": {\"start\": ISO-8601 or null, \"end\": ISO-8601 or null},
  \"malicious_files\": [string] (filenames with malicious code, empty if unknown),
  \"malicious_behavior\": string or null (brief description of the payload),
  \"summary\": string (one-paragraph summary)}.

  If the article does NOT describe a supply chain compromise, respond:
  {\"is_compromise\": false, \"confidence\": 0.0, \"package_name\": null,
  \"package_ecosystem\": null, \"affected_versions\": null,
  \"compromised_timeframe\": {\"start\": null, \"end\": null},
  \"malicious_files\": [], \"malicious_behavior\": null,
  \"summary\": \"Not a supply chain compromise.\"}" --skip-trust

# Feed sources.
# Types: rss (RSS/Atom polling), github_advisory (stub, not yet implemented).
# Tiers: 1 = real-time ingestion, 2 = deep forensics, 3 = foundational.
sources:
