  - name: socket-atom
    type: rss
    url: https://socket.dev/api/feed.atom
    tier: 1

  - name: socket-json
    type: rss
    url: https://socket.dev/api/feed.json
    tier: 1

  - name: stepsecurity
    type: rss
    url: https://www.stepsecurity.io/blog
    tier: 1

