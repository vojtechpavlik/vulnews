[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnews"
version = "0.1.0"
description = "Supply chain vulnerability notifier for SUSE/openSUSE"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
vulnews = "vulnews.__main__:main"
